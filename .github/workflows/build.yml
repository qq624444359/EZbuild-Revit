# Builds the native add-in for both supported Revits and assembles the
# Autodesk App Store bundle from the result. Pushing a version tag (v1.2.3)
# also publishes that bundle as a GitHub Release.
#
# Every release binary should come out of here rather than off a developer's
# machine: it is reproducible from the commit, and it is the precondition for
# code signing, which requires the signed binary to be built from source in CI.

name: Build

on:
  push:
    # Branch pushes build when the add-in or its packaging changes; a version
    # tag always builds (path filters do not apply to tags) and releases.
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "revit-addin/**"
      - ".github/workflows/build.yml"
      - "THIRD-PARTY-NOTICES.txt"
      - "LICENSE"
  pull_request:
    paths:
      - "revit-addin/**"
      - ".github/workflows/build.yml"
      - "THIRD-PARTY-NOTICES.txt"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # One SDK per supported Revit: 2026 runs on .NET 8, 2027 on .NET 10.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build both targets
        run: dotnet build revit-addin/EZTable/EZTable.csproj -c Release

      # Same file set PostBuild installs locally: the DLLs and the config
      # sample, next to the manifest that is already checked in for each series.
      # The licences go at the bundle root: the bundled libraries' licences
      # require their notices to travel with them.
      - name: Assemble EZTable.bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -r revit-addin/EZTable.bundle dist/
          cp LICENSE dist/EZTable.bundle/LICENSE.txt
          cp THIRD-PARTY-NOTICES.txt dist/EZTable.bundle/
          for pair in net8.0-windows:2026 net10.0-windows:2027; do
            tfm="${pair%%:*}"
            series="${pair##*:}"
            out="revit-addin/EZTable/bin/Release/$tfm"
            dest="dist/EZTable.bundle/Contents/$series"
            test -f "$out/EZTable.dll"  || { echo "::error::$tfm build produced no EZTable.dll"; exit 1; }
            test -f "$dest/EZTable.addin" || { echo "::error::no manifest checked in for Revit $series"; exit 1; }
            cp "$out"/*.dll "$dest/"
            cp revit-addin/EZTable/EZTable.config.sample "$dest/"
          done

      # Revit supplies its own API assemblies at load time. A copy shipped in
      # the bundle would shadow them, so fail loudly if one ever slips in.
      - name: Check no Revit API assemblies are bundled
        shell: bash
        run: |
          if find dist -iname 'RevitAPI*.dll' | grep -q .; then
            echo "::error::Revit API assemblies found in the bundle:"
            find dist -iname 'RevitAPI*.dll'
            exit 1
          fi

      # Every third-party DLL shipped must be listed, with its licence, in
      # THIRD-PARTY-NOTICES.txt. A new or renamed dependency fails the build
      # until the notices are updated.
      - name: Check every bundled library is in the notices
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for dll in $(find dist/EZTable.bundle/Contents -name '*.dll' -exec basename {} \; | sort -u); do
            [ "$dll" = "EZTable.dll" ] && continue
            if ! grep -qF "$dll" THIRD-PARTY-NOTICES.txt; then
              echo "::error::$dll is bundled but not listed in THIRD-PARTY-NOTICES.txt"
              missing=1
            fi
          done
          [ "$missing" = 0 ]
          find dist -type f | sort

      - uses: actions/upload-artifact@v7
        with:
          name: EZTable.bundle
          path: dist/
          if-no-files-found: error

  # Publishes the bundle built above as a GitHub Release, downloadable without
  # a GitHub login. The asset name never changes, so
  #   https://github.com/qq624444359/EZbuild-Revit/releases/latest/download/EZTable.bundle.zip
  # always serves the newest release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: EZTable.bundle
          path: dist

      # The tag, the store listing and the About dialog must all name the same
      # version, and PackageContents.xml is where it is kept.
      - name: Check the tag matches the bundle version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          app=$(grep -oP 'AppVersion="\K[^"]+' revit-addin/EZTable.bundle/PackageContents.xml)
          if [ "$tag" != "$app" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match AppVersion $app in PackageContents.xml"
            exit 1
          fi
          echo "VERSION=$app" >> "$GITHUB_ENV"

      - name: Package
        run: |
          set -euo pipefail
          (cd dist && zip -qr ../EZTable.bundle.zip EZTable.bundle)
          echo "SHA256=$(sha256sum EZTable.bundle.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          EZTable __VERSION__ for Revit 2026 and Revit 2027.

          **Install**
          1. Close Revit.
          2. Download **EZTable.bundle.zip** below and unzip it.
          3. Move the `EZTable.bundle` folder into `%AppData%\Autodesk\ApplicationPlugins` (create the `ApplicationPlugins` folder if it is not there).
          4. Start Revit. The commands are on the **EZbuild** tab, in the **Table** panel.

          The files are not code-signed yet, so Revit may ask whether to load EZTable the first time it starts. Choose **Always Load**.

          **Uninstall:** close Revit and delete the `EZTable.bundle` folder.

          SHA-256 of EZTable.bundle.zip: `__SHA256__`

          [Product page](https://www.ezbuild.co.nz/for-revit.html) · [Privacy policy](https://www.ezbuild.co.nz/for-revit-privacy.html) · [Code signing policy](https://www.ezbuild.co.nz/code-signing.html)
          EOF
          sed -i "s/^          //; s/__VERSION__/$VERSION/; s/__SHA256__/$SHA256/" notes.md
          gh release create "$GITHUB_REF_NAME" EZTable.bundle.zip \
            --title "EZTable $VERSION" --notes-file notes.md --verify-tag
